<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Wall Forest Maze</title>
  <desc id="desc">A dark framed maze made from independent cyan wall trees, with a teal route from S to E.</desc>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A7F3D0"/>
      <stop offset="0.42" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="forest" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset="1" stop-color="#14B8A6"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="620" fill="#070B14"/>
  <path d="M0 90H1200M0 520H1200M420 0V620M1140 0V620" stroke="#17263B" stroke-width="1" opacity=".55"/>
  <circle cx="92" cy="82" r="3" fill="#2DD4BF"/>
  <text x="112" y="88" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18" letter-spacing="4">OPEN SPACE  •  RUST  •  WALL-FIRST</text>

  <text x="72" y="190" fill="#F8FAFC" font-family="ui-sans-serif, Segoe UI, sans-serif" font-size="78" font-weight="800" letter-spacing="8">WALL</text>
  <text x="72" y="275" fill="url(#forest)" font-family="ui-sans-serif, Segoe UI, sans-serif" font-size="78" font-weight="800" letter-spacing="8">FOREST</text>
  <text x="72" y="360" fill="#F8FAFC" font-family="ui-sans-serif, Segoe UI, sans-serif" font-size="78" font-weight="800" letter-spacing="8">MAZE</text>
  <rect x="76" y="394" width="274" height="3" fill="#2DD4BF"/>
  <text x="72" y="445" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="20">grow walls. leave the maze.</text>
  <text x="72" y="478" fill="#5EEAD4" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="20">independent trees • connected floor</text>

  <rect x="500" y="42" width="646" height="536" rx="22" fill="#0E1626" stroke="#1D2B42" stroke-width="2"/>
  <rect x="518" y="60" width="610" height="500" rx="14" fill="#0B1220" stroke="#263A54" stroke-width="3"/>
  <rect x="534" y="76" width="578" height="468" rx="8" fill="none" stroke="#17263B" stroke-width="1"/>

  <g fill="none" stroke="url(#wall)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path d="M548 92H1098V526H548V92"/>
    <path d="M580 92V164H692V222H622V302H742V364H650V470"/>
    <path d="M760 92V188H840V250H784V330H892V412H822V526"/>
    <path d="M932 92V154H1018V226H948V294H1098"/>
    <path d="M548 242H612V344H694V430H598"/>
    <path d="M866 92V146H914V204H850V282H930V354H1004V526"/>
  </g>

  <path d="M588 186H650V258H720V318H804V386H880V448H962V490H1042" fill="none" stroke="#2DD4BF" stroke-width="4" stroke-dasharray="12 10" filter="url(#glow)"/>
  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="24" font-weight="700">
    <rect x="558" y="166" width="52" height="42" rx="6" fill="#0B1220" stroke="#22C55E" stroke-width="3"/>
    <text x="575" y="195" fill="#F8FAFC">S</text>
    <rect x="1048" y="468" width="52" height="42" rx="6" fill="#0B1220" stroke="#F59E0B" stroke-width="3"/>
    <text x="1065" y="497" fill="#F8FAFC">E</text>
  </g>

  <g fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16">
    <text x="548" y="604">WALL FOREST MAZE  /  RANDOM WALL TREES  /  OPEN FLOOR</text>
  </g>
</svg>
